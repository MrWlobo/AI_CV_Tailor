[project]
name = "ai-cv-tailor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.0",
    "langchain>=1.3.14",
    "pypdf>=6.14.2",
    "pytest>=9.1.1",
    "uvicorn>=0.52.0",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend", "src/frontend"]

[tool.pytest.ini_options]
pythonpath = ["src"]
