<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UFT-8">
        <title>AI CV Tailor</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
            <h1>AI CV Tailor</h1>
            <br>
            <form>
                <div class="drop-zone" id="drop-zone">
                    <input type="file" id="cv-file" accept=".pdf" class="hidden" />
                    <div class="drop-zone-content">
                        <p>Drag and drop CV here or <strong>click to select.</strong></p>
                        <span id="drop-file-name"></span>
                    </div>
                </div>
                <br>
                <label for="comments-input">Job Offer</label>
                <textarea id="comments-input"  rows="15" cols="35"></textarea>
            </form>
            <button id="submit-button">Submit</button>
        </main>
        <footer>AI CV Tailor 2026</footer>
        <script src="script.js"></script>
    </body>
</html>
